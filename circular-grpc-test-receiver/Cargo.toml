[package]
name = "circular-grpc-test-receiver"
description = "Circular Fast: standalone test receiver for the gRPC transaction export stream"
publish = false
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
bincode = { workspace = true }
bs58 = { workspace = true, features = ["std"] }
circular-transaction-exporter = { workspace = true }
hex = { workspace = true }
solana-hash = { workspace = true }
serde_json = { workspace = true }
solana-client = { workspace = true }
solana-connection-cache = { workspace = true }
solana-keypair = { workspace = true }
solana-rpc-client = { workspace = true }
solana-sha256-hasher = { workspace = true, features = ["sha2"] }
solana-signer = { workspace = true }
solana-system-transaction = { workspace = true }
solana-transaction = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
tonic = { workspace = true, features = ["transport"] }

[lints]
workspace = true
